# Déploiement en un clic sur Render (https://render.com/deploy?repo=https://github.com/paulwoodworking1-maker/CARCHON-OS)
services:
  - type: web
    name: carchon-os
    runtime: node
    plan: starter          # le disque persistant n'existe pas sur l'offre gratuite
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /sante
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATA_DIR
        value: /var/data
      - key: TZ
        value: Europe/Paris
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: carchon-data
      mountPath: /var/data
      sizeGB: 1
